name: PollinationsMC
version: '${project.version}'
main: dev.sugamdeol.pollinations.PollinationsPlugin
api-version: '1.21'
description: Bring Pollinations AI to your server - chat with AI models and generate AI images on maps.
author: Sugamdeol
website: https://github.com/Sugamdeol/pollinations-mc
commands:
  poll:
    description: Pollinations AI commands
    usage: |
      /poll text <prompt> - ask an AI model
      /poll image <prompt> - AI image on a map
    permission: pollinations.use
permissions:
  pollinations.use:
    description: Allows using /poll commands
    default: true